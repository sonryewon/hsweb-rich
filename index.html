  <style>
    :root {
      --brown-950: #2a1d17;
      --brown-900: #3b2a22;
      --brown-800: #4a342a;
      --brown-700: #5b4033;
      --brown-600: #755242;
      --brown-500: #8c6652;
      --sand-100: #f3eee9;
      --sand-50: #faf8f5;
      --white: #ffffff;
      --ink: #251f1b;
      --muted: #746b65;
      --line: rgba(59, 42, 34, .13);
      --shadow: 0 20px 60px rgba(42, 29, 23, .12);
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      margin: 0;
      font-family: "Nanum Gothic", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: var(--white);
      line-height: 1.7;
      word-break: keep-all;
      overflow-x: hidden;
    }
    body.menu-open { overflow: hidden; }
    img { width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .container { width: min(calc(100% - 40px), var(--max)); margin: 0 auto; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--brown-700);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: currentColor;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { line-height: 1.25; letter-spacing: -.035em; }
    h2 { font-size: clamp(2rem, 4vw, 3.6rem); margin-bottom: 20px; }
    .lead { color: var(--muted); font-size: clamp(1rem, 1.3vw, 1.14rem); max-width: 690px; }
    .section { padding: 110px 0; }
    .section-dark { background: var(--brown-950); color: var(--white); }
    .section-soft { background: var(--sand-50); }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 54px; }
    .section-head .lead { margin-bottom: 0; }
    .section-dark .lead, .section-dark .muted { color: rgba(255,255,255,.68); }
    .section-dark .eyebrow { color: #d6bdad; }

    /* Header */
    .site-header {
      position: fixed;
      z-index: 1000;
      top: 0; left: 0; right: 0;
      height: 78px;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,.88);
      border-bottom: 1px solid transparent;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: .3s ease;
    }
    .site-header.scrolled {
      border-bottom-color: var(--line);
      box-shadow: 0 12px 30px rgba(42,29,23,.05);
    }
    .nav-wrap { width: min(calc(100% - 40px), 1320px); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 1.08rem; font-weight: 800; letter-spacing: -.03em; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px;
      background: var(--brown-900);
      display: grid; place-items: center;
      color: white;
      box-shadow: 0 10px 24px rgba(59,42,34,.18);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .nav { display: flex; align-items: center; gap: 6px; }
    .nav a {
      position: relative;
      padding: 11px 13px;
      border-radius: 10px;
      color: #514942;
      font-weight: 700;
      font-size: .93rem;
      transition: .2s ease;
    }
    .nav a:hover, .nav a.active { background: var(--sand-100); color: var(--brown-900); }
    .nav-cta { background: var(--brown-900) !important; color: white !important; padding-inline: 18px !important; }
    .menu-btn { display: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--sand-100); color: var(--brown-900); }
    .menu-btn span { display: block; width: 20px; height: 2px; margin: 4px auto; background: currentColor; transition: .25s ease; }

    /* Hero */
    .hero {
      position: relative;
      min-height: 100svh;
      padding: 132px 0 70px;
      display: flex;
      align-items: center;
      background:
        linear-gradient(90deg, rgba(42,29,23,.86) 0%, rgba(42,29,23,.72) 42%, rgba(42,29,23,.26) 72%, rgba(42,29,23,.1) 100%),
        url("https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=2000&q=90") center/cover no-repeat;
      color: var(--white);
      isolation: isolate;
    }
    .hero::after {
      content: "";
      position: absolute; inset: auto 0 0;
      height: 180px;
      background: linear-gradient(to top, rgba(42,29,23,.32), transparent);
      z-index: -1;
    }
